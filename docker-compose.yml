# Production Compose for Open Presenter (Claper + Word Cloud + Open Ended +
# PowerPoint add-in). See docs/deployment.md.
#
#   cp .env.example .env   # then edit
#   docker compose pull && docker compose up -d
#
# PostgreSQL is only reachable on the internal network; never publish 5432.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB:-openpresenter}", "-U", "${POSTGRES_USER:-openpresenter}"]
      interval: 10s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openpresenter}
      POSTGRES_USER: ${POSTGRES_USER:-openpresenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks:
      - app-network

  app:
    image: ${APP_IMAGE:-ghcr.io/YOUR_USERNAME/open-presenter:latest}
    # build: .   # uncomment to build on the VPS instead of pulling from GHCR
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4000/health"]
      interval: 30s
      retries: 3
      start_period: 40s
      timeout: 5s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - proxy-network
    # Expose the port only when no reverse proxy is in front:
    # ports:
    #   - "4000:4000"
    labels:
      # Traefik (Hostinger Docker VPS templates ship Traefik on network "proxy-network").
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.open-presenter.rule=Host(`${DOMAIN:-poll.example.com}`)"
      - "traefik.http.routers.open-presenter.entrypoints=websecure"
      - "traefik.http.routers.open-presenter.tls.certresolver=letsencrypt"
      - "traefik.http.services.open-presenter.loadbalancer.server.port=4000"
      # WebSockets need no extra config with Traefik v2/v3.

volumes:
  postgres-data:
  uploads:

networks:
  app-network:
  proxy-network:
    external: true
